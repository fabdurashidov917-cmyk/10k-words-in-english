<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#120524"/>
      <stop offset="50%" stop-color="#0a0214"/>
      <stop offset="100%" stop-color="#05010a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#d946ef"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- iOS App Icon Squircle Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>
  
  <!-- Subtle Glowing Inner Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#neonGrad)" stroke-width="3" opacity="0.3"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Stylized Lightning 'S' / 'L' Lexicon Monogram -->
  <path d="M 285 75 L 165 265 L 255 265 L 210 435 L 355 235 L 265 235 Z" 
        fill="url(#neonGrad)" 
        filter="url(#glow)"/>
        
  <!-- Japanese Katakana Shadow Accent -->
  <text x="256" y="475" text-anchor="middle" font-family="-apple-system, sans-serif" font-weight="900" font-size="28" fill="rgba(255,255,255,0.45)" letter-spacing="6">シャドウ</text>
</svg>